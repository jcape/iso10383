[package]
authors.workspace = true
categories = ["finance", "localization", "parser-implementations"]
description = "Parser for ISO 10383 XML Data"
documentation = "https://docs.rs/iso10383-parser"
edition.workspace = true
keywords = ["iso10383", "mic"]
license.workspace = true
name = "iso10383-parser"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
iso10383-types = { features = ["serde"], workspace = true }
iso3166-static = { features = ["alloc", "serde"], workspace = true }
serde = { features = ["derive"], workspace = true }

[dev-dependencies]
quick-xml.workspace = true
yare = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
