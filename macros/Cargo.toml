[package]
authors.workspace = true
categories = ["finance", "localization"]
description = "Code generation for ISO 10383 MIC Data"
documentation = "https://docs.rs/iso10383-macros"
edition = "2024"
keywords = ["iso10383", "mic"]
license.workspace = true
name = "iso10383-macros"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
iso10383-parser.workspace = true
iso10383-types.workspace = true
iso17442-types.workspace = true
itertools = "0.15"
jiff.workspace = true
proc-macro2 = "1"
quick-xml.workspace = true
quote = "1"
serde = { features = ["std"], workspace = true }
syn = { features = ["full"], version = "3" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
