[package]
authors.workspace = true
categories = ["finance", "localization", "no-std", "no-std::no-alloc"]
description = "Static ISO 10383 Market Identifier Code Data"
documentation = "https://docs.rs/iso10383-static"
edition.workspace = true
keywords = ["iso10383", "mic"]
license.workspace = true
name = "iso10383-static"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
iso10383-macros.workspace = true
iso10383-types.workspace = true
iso17442-types.workspace = true
iso3166-static.workspace = true
jiff.workspace = true
serde = { optional = true, workspace = true }
zerocopy = { optional = true, workspace = true }

[dev-dependencies]
serde_json.workspace = true

[features]
alloc = [
  "iso10383-types/alloc",
  "iso17442-types/alloc",
  "iso3166-static/alloc",
  "jiff/alloc",
  "serde?/alloc",
  "zerocopy?/alloc",
]
default = ["serde"]
serde = [
  "dep:serde",
  "iso10383-types/serde",
  "iso17442-types/serde",
  "iso3166-static/serde",
  "jiff/serde",
]
zerocopy = ["dep:zerocopy"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
